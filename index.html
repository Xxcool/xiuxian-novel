<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="《签到修仙：从废柴到万古一帝》——废柴少年获得系统后逆袭的修仙爽文在线阅读。" />
    <title>签到修仙：从废柴到万古一帝</title>
    <script>
      // 早期注入主题，避免首屏白闪；与 useTheme 共用 'xx-theme' 键（存的是主题 key）
      (function () {
        try {
          var k = localStorage.getItem('xx-theme');
          var night = k === 'night' || (!k && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.setAttribute('data-theme', night ? 'dark' : 'light');
          el.style.backgroundColor = night ? '#1a1a1a' : '#f4ecd8';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
