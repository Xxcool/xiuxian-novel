<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="《签到修仙：从废柴到万古一帝》——废柴少年获得系统后逆袭的修仙爽文在线阅读。" />
    <title>签到修仙：从废柴到万古一帝</title>
    <!-- 印章 favicon：SVG 优先，ICO 兜底（16px 单字防糊），apple-touch-icon 供 iOS 添加主屏 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e2630" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f2" />
    <script>
      // 早期注入主题，避免首屏白闪；与 useTheme 共用 'xx-theme'键（存的是主题 key）。
      // 色值需与 theme.js 中的 night / 白天默认主题保持同步。
      (function () {
        try {
          var k = localStorage.getItem('xx-theme');
          var night = k === 'night' || (!k && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var initial = k === 'night' || k === 'warm' || k === 'paper' ? k : (night ? 'night' : 'warm');
          var el = document.documentElement;
          el.setAttribute('data-theme', night ? 'dark' : 'light');
          el.setAttribute('data-theme-key', initial);
          el.style.backgroundColor = initial === 'night' ? '#1e2630' : initial === 'paper' ? '#f7f1e7' : '#f8f7f2';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
